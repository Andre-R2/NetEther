site_name: NetEther
site_description: Technical documentation for Networking, Linux, Infrastructure and Cybersecurity.
repo_url: https://github.com/andre-r2/NetEther
repo_name: andre-r2/NetEther

theme:
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg

  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: IBM Plex Mono

  features:
    - navigation.sidebar.collapse
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - git-revision-date-localized:
      type: date

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.tabbed:
      alternate_style: true

  - tables

  - toc:
      permalink: true

